name: Build Standalone Packages

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: "dist/OpenDeskCast-v*"
          - os: ubuntu-latest
            artifact_glob: "dist/*"
          - os: macos-latest
            artifact_glob: "dist/OpenDeskCast-v*-macos*"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10 (Build-time only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build standalone OS package
        run: python scripts/build_package.py

      - name: Build WiX Windows MSI (Windows only)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 4.0.5 --add-source https://api.nuget.org/v3/index.json
          python scripts/build_msi.py

      - name: Upload standalone release artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenDeskCast-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: ${{ matrix.artifact_glob }}
          generate_release_notes: false
